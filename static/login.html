<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in - Kertoons</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header>
  <h1>🧸 Kertoons</h1>
  <nav id="nav-bar" class="nav-bar"></nav>
</header>

<main class="narrow">
  <div id="error-box"></div>

  <section class="card auth-card">
    <h2>Log in</h2>
    <form id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">

      <label for="captcha-input">Enter the code shown</label>
      <div class="captcha-row">
        <img id="captcha-img" alt="Captcha code" width="140" height="50">
        <button type="button" class="btn-outline" id="captcha-refresh" title="Get a new code">🔄</button>
        <input type="text" id="captcha-input" inputmode="numeric" pattern="[0-9]*" maxlength="4"
               autocomplete="off" placeholder="0000" required>
      </div>

      <button type="submit" class="btn-primary" id="submit-btn">Log in</button>
    </form>
    <p class="hint">No account yet? <a href="register.html">Register</a></p>
  </section>
</main>

<script src="static/nav.js"></script>
<script src="static/auth.js"></script>

<footer class="site-footer">
  <p><a href="faq.html">FAQ</a> · <a href="help.html">Help</a> ·
  <span id="site-footer-text">kertoons.com - Another Elisda AI project</span><span id="footer-contact-email-wrap" style="display:none;"> · <a id="footer-contact-email-link" href="#"><span id="footer-contact-email"></span></a></span><span id="footer-contact-phone-wrap" style="display:none;"> · <span id="footer-contact-phone"></span></span></p>
</footer>
</body>
</html>
