<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competition - Kertoons</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header>
  <h1><img src="static/logo.png" alt="Kertoons" class="site-logo"></h1>
  <nav id="nav-bar" class="nav-bar"></nav>
</header>

<main>
  <p><a class="btn-outline" href="competitions.html">‹ All Competitions</a></p>
  <div id="competition-banner" class="banner"></div>

  <section class="card" id="competition-info-card">
    <h2 id="competition-title">Loading...</h2>
    <p id="competition-theme" class="hint"></p>
    <p id="competition-description"></p>
    <p id="competition-dates" class="hint"></p>
  </section>

  <section id="login-required" class="card" style="display:none;">
    <p>Please <a href="login.html">log in</a> to enter this competition.</p>
  </section>

  <section id="enter-card" class="card" style="display:none;">
    <h2>Enter This Competition</h2>
    <div id="my-entry-summary"></div>
    <div id="enter-form-wrap">
      <label for="existing-story-select">Submit an existing story</label>
      <div class="admin-inline-form">
        <select id="existing-story-select" style="flex:1; min-width:220px;"></select>
        <button type="button" class="btn-secondary" id="submit-existing-btn">Submit</button>
      </div>
      <p class="hint">or</p>
      <a class="btn-primary" id="create-new-link" href="create.html">Create a new story for this competition ✨</a>
    </div>
  </section>

  <section class="card">
    <h2>Leaderboard</h2>
    <div id="leaderboard-wrap"></div>
  </section>
</main>

<script src="static/nav.js"></script>
<script src="static/competition.js"></script>

<footer class="site-footer">
  <p><a href="faq.html">FAQ</a> · <a href="help.html">Help</a> ·
  <span id="site-footer-text">kertoons.com - Another Elisda AI project</span><span id="footer-contact-email-wrap" style="display:none;"> · <a id="footer-contact-email-link" href="#"><span id="footer-contact-email"></span></a></span><span id="footer-contact-phone-wrap" style="display:none;"> · <span id="footer-contact-phone"></span></span><span id="footer-custom-links"></span></p>
</footer>
</body>
</html>
