<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Kertoons</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header>
  <h1>🧸 Kertoons</h1>
  <nav id="nav-bar" class="nav-bar"></nav>
</header>

<main class="narrow">
  <div id="error-box"></div>

  <section class="card auth-card">
    <h2>Create an account</h2>
    <form id="register-form">
      <label for="username">Username</label>
      <input type="text" id="username" required minlength="3" maxlength="30" autocomplete="username">
      <p class="hint">3-30 characters: letters, numbers, _ . -</p>

      <label for="password">Password</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password">
      <p class="hint">At least 6 characters.</p>

      <label for="confirm_password">Confirm password</label>
      <input type="password" id="confirm_password" required minlength="6" autocomplete="new-password">

      <button type="submit" class="btn-primary" id="submit-btn">Create account</button>
    </form>
    <p class="hint">Already have an account? <a href="login.html">Log in</a></p>
  </section>
</main>

<script src="static/nav.js"></script>
<script src="static/auth.js"></script>

<footer class="site-footer">
  <p><a href="faq.html">FAQ</a> · <a href="help.html">Help</a> ·
  <a href="https://kertoons.com" target="_blank" rel="noopener">kertoons.com</a> - Another Elisda AI project</p>
</footer>
</body>
</html>
