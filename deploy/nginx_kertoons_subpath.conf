# Location block to ADD inside your EXISTING kertoons.com nginx server {}
# block - the same one that already answers for the kertoons.com domain.
# Do NOT create a new `server {}` block for this; paste these two location
# blocks inside the existing one (alongside its other `location` blocks),
# then `nginx -t && systemctl reload nginx`.
#
# This assumes the Kertoons app runs on the SAME machine as kertoons.com,
# as its own systemd service (see deploy/kertoons.service) bound to
# 127.0.0.1:8765 - i.e. never reachable directly, only through this proxy.
# If port 8765 is already used by something else on this server, change it
# here AND in the app's .env (PORT=...) to match.

    # Bare "/stories" (no trailing slash) must redirect to "/stories/" -
    # every asset/API path the app emits is relative, so it depends on the
    # browser resolving them against a URL that ends in "/stories/".
    location = /stories {
        return 301 /stories/;
    }

    location /stories/ {
        client_max_body_size 12m;  # character-photo uploads are sent as base64 JSON

        # The trailing "/" on both the location and the proxy_pass target is
        # what makes nginx strip the "/stories/" prefix before forwarding -
        # e.g. a request for /stories/api/me reaches the app as plain
        # /api/me, so server.py needs zero awareness of being mounted under
        # a subpath.
        proxy_pass http://127.0.0.1:8765/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
