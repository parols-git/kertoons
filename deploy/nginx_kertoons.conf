# nginx reverse proxy for Kertoons - terminates the public-facing port
# (80/443) and forwards to the app, which stays bound to 127.0.0.1 only
# (never exposed directly to the internet).
#
# Install (on the Droplet, as root/sudo):
#   sudo cp deploy/nginx_kertoons.conf /etc/nginx/sites-available/kertoons
#   sudo ln -s /etc/nginx/sites-available/kertoons /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN_OR_IP below with your droplet's IP (no domain yet) or
# your real domain name (e.g. kertoons.example.com). If you run `certbot
# --nginx` afterward (see DEPLOY.md), it edits this file in place to add
# HTTPS - you don't need to hand-write the TLS block yourself.

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    client_max_body_size 12m;  # character-photo uploads are sent as base64 JSON

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
