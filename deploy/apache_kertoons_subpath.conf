# Directives to ADD inside your EXISTING kertoons.com Apache <VirtualHost>
# block(s) - likely in /etc/apache2/sites-available/kertoons.com.conf (port
# 80) AND /etc/apache2/sites-available/kertoons.com-le-ssl.conf or similar
# (port 443, if using Let's Encrypt/certbot) - add it to BOTH if both exist,
# so /stories works over HTTPS too.
#
# Requires mod_proxy and mod_proxy_http enabled first:
#   a2enmod proxy proxy_http
#   systemctl restart apache2
#
# This assumes the Kertoons app runs on the SAME machine as kertoons.com,
# as its own systemd service (see deploy/kertoons.service) bound to
# 127.0.0.1:8765 - i.e. never reachable directly, only through this proxy.
# If port 8765 is already used by something else on this server, change it
# here AND in the app's .env (PORT=...) to match.
#
# IMPORTANT: if a plain directory named "stories" exists under this site's
# DocumentRoot (that's what produces an Apache "Index of /stories" listing -
# an empty folder with no index file, being served straight off disk),
# ProxyPass below takes priority for matching URLs regardless, but it's
# clearer to just remove that folder: `rm -rf /var/www/kertoons.com/stories`
# (adjust to your actual DocumentRoot).

    # The trailing "/" on both ProxyPass and ProxyPassReverse is what makes
    # Apache strip the "/stories/" prefix before forwarding - e.g. a request
    # for /stories/api/me reaches the app as plain /api/me, so server.py
    # needs zero awareness of being mounted under a subpath.
    ProxyPass "/stories/" "http://127.0.0.1:8765/"
    ProxyPassReverse "/stories/" "http://127.0.0.1:8765/"

    # Bare "/stories" (no trailing slash) must redirect to "/stories/" -
    # every asset/API path the app emits is relative, so it depends on the
    # browser resolving them against a URL that ends in "/stories/".
    RedirectMatch ^/stories$ /stories/

    <Location "/stories/">
        # Character-photo uploads are sent as base64 JSON - Apache has no
        # single equivalent of nginx's client_max_body_size; LimitRequestBody
        # is bytes, 12m worth of base64 plus headroom.
        LimitRequestBody 15000000
        ProxyPreserveHost On
    </Location>
